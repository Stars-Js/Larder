<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larder · 本地知识库</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="app.css?v=44">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <a class="brand" href="#/libraries" aria-label="Larder 首页">
        <span class="logo" aria-hidden="true"><img src="logo.svg" alt=""></span>
        <span class="brand-text">
          <span class="brand-name">Larder</span>
          <span class="brand-sub">本地知识库</span>
        </span>
      </a>
      <button class="side-collapse" id="sideCollapse" type="button" title="收起侧边栏" aria-label="收起侧边栏">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="15" height="14" rx="3"/><path d="M8 3v14M5.2 7.5h.01M5.2 10h.01M5.2 12.5h.01"/></svg>
      </button>
    </div>

    <nav class="side-nav" id="nav" aria-label="主导航">
      <div class="nav-group">
        <div class="nav-label">使用</div>
        <a href="#/libraries" data-route="libraries" class="nav-item">
          <span class="nav-dot" aria-hidden="true"></span>
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5A1.5 1.5 0 0 1 5 4h3l1.5 2h5.5a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 15 16H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
          </span>
          <span class="nav-text">知识库</span>
        </a>
        <a href="#/search" data-route="search" class="nav-item">
          <span class="nav-dot" aria-hidden="true"></span>
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="4.5"/><path d="M12 12l4 4"/></svg>
          </span>
          <span class="nav-text">检索</span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-label">观测</div>
        <a href="#/usage" data-route="usage" class="nav-item">
          <span class="nav-dot" aria-hidden="true"></span>
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 16.5h13M5.5 16V9M10 16V4.5M14.5 16v-4"/></svg>
          </span>
          <span class="nav-text">用量</span>
        </a>
        <a href="#/logs" data-route="logs" class="nav-item">
          <span class="nav-dot" aria-hidden="true"></span>
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4.5h12M4 9h12M4 13.5h8"/><circle cx="15.5" cy="15.5" r="2.2"/><path d="M15.5 14.3v1.4l1 .6"/></svg>
          </span>
          <span class="nav-text">日志</span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-label">系统</div>
        <a href="#/settings" data-route="settings" class="nav-item">
          <span class="nav-dot" aria-hidden="true"></span>
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.4"/><path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M15.1 4.9l-1.4 1.4M6.3 13.7l-1.4 1.4"/></svg>
          </span>
          <span class="nav-text">设置</span>
        </a>
      </div>
    </nav>

    <div class="side-foot">
      <a class="side-status" href="#/settings" id="sideStatus" title="MCP 服务状态">
        <i class="dot" id="sideDot"></i>
        <span class="side-status-text">
          <b>MCP 服务</b>
          <span id="sideMcpText">连接中…</span>
        </span>
      </a>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim" hidden></div>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="side-toggle" id="sideToggle" type="button" title="打开导航" aria-label="打开导航">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg>
        </button>
        <div class="crumb" id="crumb">知识库</div>
      </div>
      <div class="top-right">
        <span class="conn" id="conn" title="MCP 服务状态">
          <i class="dot" id="statusDot"></i>
          <span id="statusText">连接中…</span>
        </span>
      </div>
    </header>
    <section class="content" id="view" role="main"></section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js?v=46"></script>
</body>
</html>
