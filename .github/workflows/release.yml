name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Windows binaries
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o release/larder-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-s -w -H windowsgui" -o release/larder-windows-arm64.exe .
          cd release
          sha256sum larder-windows-amd64.exe larder-windows-arm64.exe > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Larder ${{ github.ref_name }}
          files: |
            release/larder-windows-amd64.exe
            release/larder-windows-arm64.exe
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
